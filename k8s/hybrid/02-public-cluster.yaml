# ==============================================================================
# ENVIRONMENT B: PUBLIC CLOUD CLUSTER DEPLOYMENT (AWS / EKS SIMULATION)
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trendpulse-public
  namespace: trendpulse
  labels:
    app: trendpulse-hybrid
    cluster: public-cloud-aws
    tier: secondary
spec:
  replicas: 2
  selector:
    matchLabels:
      app: trendpulse-hybrid
      cluster: public-cloud-aws
  template:
    metadata:
      labels:
        app: trendpulse-hybrid
        cluster: public-cloud-aws
        tier: secondary
    spec:
      containers:
      - name: web
        image: trendpulse-app:optimized
        ports:
        - containerPort: 8000
        env:
        - name: CLUSTER_ENV
          value: "public-cloud-aws-us-east-1"
        - name: DEPLOYMENT_TIER
          value: "secondary-failover"
        - name: REDIS_HOST
          value: "redis"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: service-public-cluster
  namespace: trendpulse
  labels:
    app: trendpulse-hybrid
    cluster: public-cloud-aws
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8000
    name: http
  selector:
    app: trendpulse-hybrid
    cluster: public-cloud-aws
