# ==============================================================================
# ENVIRONMENT A: PRIVATE ON-PREMISE CLUSTER DEPLOYMENT
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trendpulse-private
  namespace: trendpulse
  labels:
    app: trendpulse-hybrid
    cluster: private-onprem
    tier: primary
spec:
  replicas: 2
  selector:
    matchLabels:
      app: trendpulse-hybrid
      cluster: private-onprem
  template:
    metadata:
      labels:
        app: trendpulse-hybrid
        cluster: private-onprem
        tier: primary
    spec:
      containers:
      - name: web
        image: trendpulse-app:optimized
        ports:
        - containerPort: 8000
        env:
        - name: CLUSTER_ENV
          value: "private-cluster-onprem"
        - name: DEPLOYMENT_TIER
          value: "primary"
        - name: REDIS_HOST
          value: "redis"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: service-private-cluster
  namespace: trendpulse
  labels:
    app: trendpulse-hybrid
    cluster: private-onprem
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8000
    name: http
  selector:
    app: trendpulse-hybrid
    cluster: private-onprem
