apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: trendpulse-web-hpa
  namespace: trendpulse
  labels:
    app: trendpulse-web
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: trendpulse-web
  # Task 3 Requirements: min 2, max 6, 50% CPU
  minReplicas: 2
  maxReplicas: 6
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
      - type: Pods
        value: 2
        periodSeconds: 15
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 50
        periodSeconds: 30
