# NGINX Automatic Health-Checked Failover Configuration
upstream hybrid_backend {
    # Primary: Private On-Premise Cluster
    server web-private-cluster:8000 max_fails=2 fail_timeout=5s;

    # Secondary: Public Cloud Cluster (Designated Backup)
    server web-public-cloud:8000 backup;
}

server {
    listen 80;
    server_name localhost;

    location / {
        proxy_pass http://hybrid_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Immediate Failover Directives
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 3;

        # Cache bypass and telemetry headers
        add_header X-Served-By-Router "Hybrid-Global-Ingress";
    }
}
