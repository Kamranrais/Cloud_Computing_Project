#! redis-deployment.yaml
# Generated code, do not edit
apiVersion: apps/v1
kind: Deployment
metadata:
    name: redis
    namespace: cloud-computing-project
    labels:
        com.docker.compose.project: cloud_computing_project
        com.docker.compose.service: redis
spec:
    replicas: 1
    selector:
        matchLabels:
            com.docker.compose.project: cloud_computing_project
            com.docker.compose.service: redis
    strategy:
        type: Recreate
    template:
        metadata:
            labels:
                com.docker.compose.project: cloud_computing_project
                com.docker.compose.service: redis
                com.docker.compose.network.default: "true"
        spec:
            restartPolicy: unless-stopped
            containers:
                - name: redis
                  image: redis:7.2-alpine
                  imagePullPolicy: IfNotPresent
                  args:
                    - redis-server
                    - --save
                    - 60
                    - 1
                    - --loglevel
                    - warning
                  livenessProbe:
                    exec:
                        command: [redis-cli ping]
                    periodSeconds: 5
                    timeoutSeconds: 3
                    failureThreshold: 5
                  ports:
                    - name: redis-6379
                      containerPort: 6379
                  volumeMounts:
                    - name: data
                      mountPath: /data
            volumes:
                - name: data
                  persistentVolumeClaim:
                    claimName: redis-redis-data
